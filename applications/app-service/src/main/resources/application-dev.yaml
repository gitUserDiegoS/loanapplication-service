server:
  port: 8080
spring:
  r2dbc:
    host: ${R2DBC_HOST_LOAN}
    port: "3306"
    username: ${CREDI_USER_DB}
    password: ${CREDI_PASS_DB}
    database: "loanapplication-db"
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapter:
  restconsumer:
    timeout: 5000
    url: "http://authentication-service:8080"
  sqs:
    queueUrl: "https://sqs.sa-east-1.amazonaws.com/027419662433/loan-notifier-sqs"
    queueDebCapacityRequestUrl: "https://sqs.sa-east-1.amazonaws.com/027419662433/debt-capacity-request-queue"
    queueDebCapacityResponseUrl: "https://sqs.sa-east-1.amazonaws.com/027419662433/debt-capacity-response-queue"
